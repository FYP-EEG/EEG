[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-sdk"
version = "0.12.0"
description = "A developer library for building brain-controlled user interfaces from EEG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brian" }, { name = "Anson Li" }]
keywords = ["bci", "eeg", "ssvep", "brain-computer-interface", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
ui = ["pygame-ce>=2.5"]
hardware = ["brainflow>=5.22.0"]
research = ["mne>=1.5", "matplotlib>=3.7", "seaborn>=0.12", "pandas>=2.0"]
public-mi = [
  "mne>=1.5", "moabb>=1.2", "pandas>=2.0",
  "openneuro-py>=2024.2.0; python_version >= '3.10'",
]
transformer = ["torch>=2.1", "braindecode>=2.0"]
all = [
  "pygame-ce>=2.5", "brainflow>=5.22.0", "mne>=1.5",
  "moabb>=1.2", "pandas>=2.0",
  "openneuro-py>=2024.2.0; python_version >= '3.10'",
  "torch>=2.1", "braindecode>=2.0",
]

[project.scripts]
bci-speller = "example.bci_speller:main"
bci-calibrate = "EEG.calibration_record:main"
bci-public-mi = "ML.public_mi:main"
bci-train-public-mi = "ML.train_public_mi:main"
bci-train-intent-mi = "ML.train_intent_mi:main"

[tool.setuptools]
packages = ["bci_sdk", "ML"]
py-modules = []

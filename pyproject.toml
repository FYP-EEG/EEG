[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-sdk"
version = "0.10.0"
description = "A developer library for building brain-controlled user interfaces from EEG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brian" }, { name = "Anson Li" }]
keywords = ["bci", "eeg", "ssvep", "brain-computer-interface", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
ui = ["pygame-ce>=2.5"]
hardware = ["brainflow>=5.10"]
research = ["mne>=1.5", "matplotlib>=3.7", "seaborn>=0.12", "pandas>=2.0"]
all = ["pygame-ce>=2.5", "brainflow>=5.10"]

[project.scripts]
bci-speller = "example.bci_speller:main"
bci-calibrate = "EEG.calibration_record:main"

[tool.setuptools]
packages = ["bci_sdk", "ML"]
py-modules = []
